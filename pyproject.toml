[project]
name = "themerr-plex"
version = "0.0.0"
description = "Standalone theme song manager for Plex"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "LizardByte", email = "lizardbyte@users.noreply.github.com" }]
dependencies = [
    "alembic==1.20.0",
    "anyio==4.15.1",
    "av==19.0.1",
    "babel==2.18.0",
    "configobj==5.0.9",
    "cryptography==50.0.2",
    "desktop-notifier==6.2.0",
    "fastapi==0.142.2",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "keyring==25.7.0",
    "packaging==26.3",
    "pillow==12.3.0",
    "plexapi[alert]==4.18.3",
    "polib==1.2.0",
    "pystray==0.19.5",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "requests-cache==1.3.3",
    "schedule==1.2.2",
    "sqlalchemy==2.1.3",
    "starlette==1.7.0",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
    "werkzeug==3.1.9",
    "yt-dlp[default]==2026.8.19",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
dev = [
    "flake8==7.4.1",
    "httpx2==2.13.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
docs = [
    "lizardbyte-dockle[sphinx]==2026.924.215413",
    "numpydoc==1.11.0",
    "rstcheck[sphinx]==6.3.0",
]

[project.urls]
Homepage = "https://github.com/LizardByte/Themerr-plex"
Repository = "https://github.com/LizardByte/Themerr-plex"
Issues = "https://github.com/LizardByte/Themerr-plex/issues"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/functional"]
pythonpath = ["src"]
addopts = [
    "-rxXs",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage/python-coverage.xml",
    "--junitxml=junit-python.xml",
    "-o", "junit_family=legacy",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
