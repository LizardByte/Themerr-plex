[project]
name = "themerr-plex"
version = "0.0.0"
description = "Standalone theme song manager for Plex"
readme = "README.rst"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "LizardByte", email = "lizardbyte@users.noreply.github.com" }]
dependencies = [
    "babel==2.18.0",
    "configobj==5.0.9",
    "cryptography==50.0.1",
    "flask==3.1.3",
    "flask-babel==4.0.0",
    "flask-wtf==1.3.0",
    "pillow==12.3.0",
    "plexapi[alert]==4.18.3",
    "polib==1.2.0",
    "pystray==0.19.5",
    "requests==2.34.2",
    "requests-cache==1.3.3",
    "schedule==1.2.2",
    "urllib3==2.8.0",
    "werkzeug==3.1.9",
    "yt-dlp[default]==2026.8.19",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
dev = ["flake8==7.4.1", "pytest==9.1.1", "pytest-cov==7.1.0"]
docs = [
    "lizardbyte-dockle[sphinx]==2026.924.215413",
    "numpydoc==1.11.0",
    "rstcheck[sphinx]==6.3.0",
]

[project.urls]
Homepage = "https://github.com/LizardByte/Themerr-plex"
Repository = "https://github.com/LizardByte/Themerr-plex"
Issues = "https://github.com/LizardByte/Themerr-plex/issues"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/functional"]
pythonpath = ["src"]
addopts = [
    "-rxXs",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage/python-coverage.xml",
    "--junitxml=junit-python.xml",
    "-o", "junit_family=legacy",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
