<button type="button" class="icon-button theme-switcher" data-color-theme
        data-auto-label="{{ _('Theme: Automatic. Switch to light mode.') }}"
        data-light-label="{{ _('Theme: Light. Switch to dark mode.') }}"
        data-dark-label="{{ _('Theme: Dark. Switch to automatic mode.') }}"
        aria-label="{{ _('Theme: Automatic. Switch to light mode.') }}">
    <span data-theme-icon="auto" aria-hidden="true"><i data-lucide="sun-moon"></i></span>
    <span data-theme-icon="light" aria-hidden="true" hidden><i data-lucide="sun"></i></span>
    <span data-theme-icon="dark" aria-hidden="true" hidden><i data-lucide="moon"></i></span>
</button>
