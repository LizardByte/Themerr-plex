version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "miniforge3-26.3"
  jobs:
    build:
      html:
        - bash scripts/readthedocs_build.sh

conda:
  environment: docs/environment.yml

submodules:
  include: all
  recursive: true
