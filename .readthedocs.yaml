---
# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-26.04
  tools:
    python: "miniforge3-26.3"
  jobs:
    build:
      html:
        - |
          uv run --no-sync python scripts/localize.py --compile
          uv run --no-sync dockle check
          uv run --no-sync dockle build
          mkdir -p "${READTHEDOCS_OUTPUT}html/"
          cp -r _site/. "${READTHEDOCS_OUTPUT}html/"

    post_install:
      - uv sync --locked --extra docs --no-install-project --no-build

conda:
  environment: docs/environment.yml

submodules:
  include:
    - third-party/sphinx-csharp
