[project]
name = "Themerr-plex"
version = "0.0.0"
description = "Standalone theme song manager for Plex."
repository = "https://github.com/LizardByte/Themerr-plex"
author = "LizardByte"
logo = "web/images/icon-default.png"
favicon = "web/images/favicon.ico"

[build]
output = "_site"
work = ".dockle"
strict = true
clean = true

[[targets]]
name = "docs"
title = "Themerr-plex documentation"
framework = "sphinx"
source = "docs/source"
home = true

[targets.sphinx]
extra_config = "docs/dockle_sphinx.py"
source_edit_link = "https://github.com/LizardByte/Themerr-plex/blob/master/docs/source/{filename}"
static_paths = ["docs/source/_static"]
extra_stylesheets = [
  "https://cdn.jsdelivr.net/npm/@lizardbyte/shared-web@2026.930.34219/dist/crowdin-dockle-css.css",
]
extra_javascript = [
  "https://cdn.jsdelivr.net/npm/@lizardbyte/shared-web@2026.930.34219/dist/crowdin.js",
  "js/crowdin.js",
]
